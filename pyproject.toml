[project]
name = "booknlp"
version = "1.0.8"
description = "BookNLP: NLP pipeline for books and long documents"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "torch>=2.14",
    "transformers>=4.40",
    "spacy>=3.7",
    "numpy>=2.0",
    "httpx[socks]>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["booknlp"]

[tool.hatch.build.targets.wheel.force-include]
"booknlp/english/data" = "booknlp/english/data"
